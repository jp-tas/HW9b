<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tas's Exercise 3: New Articles</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/public/ex3.js" defer></script>
</head>
<body>
    <h1>Tas's Articles/Form Solution</h1>
    <h2>Add new article</h2>
    <form id="article-form" action="/articles" method="post">
        <p><label for="title">Title:</label> <input type="text" id="title" name="title" required></p>
        <p>
            <label for="content">Content:</label><br>
            <textarea id="content" name="content" rows="5" cols="30" required></textarea>
        </p>
        <button type="submit">Add</button>
    </form>
    <p id="confirmation" aria-live="polite"></p>
    <p class="back-link"><a href="/">Back to Homework 9b</a></p>
</body>
</html>
