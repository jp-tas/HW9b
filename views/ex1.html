<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tas's Exercise 1: Process a Form</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/public/ex1.js" defer></script>
</head>
<body>
    <h1>Tas's Sample Form</h1>
    <form id="sample-form" class="sample-form" action="/form" method="post">
        <p><label for="name">Name:</label> <input type="text" id="name" name="name" required></p>
        <p><label for="email">Email:</label> <input type="email" id="email" name="email" placeholder="name@domain" required></p>
        <fieldset>
            <legend>Payment Type:</legend>
            <label><input type="radio" name="payment" value="cash"> Cash</label>
            <label><input type="radio" name="payment" value="creditcard"> Credit Card</label>
            <label><input type="radio" name="payment" value="gpay"> Google Pay</label>
            <label><input type="radio" name="payment" value="applepay"> Apple Pay</label>
        </fieldset>
        <p><label><input type="checkbox" name="promotion"> Sign me up for special promotions</label></p>
        <p>
            <label for="location">Preferred Location:</label>
            <select id="location" name="location">
                <option value="la">Los Angeles</option>
                <option value="oc">Orange County</option>
                <option value="riverside">Riverside</option>
                <option value="sd">San Diego</option>
            </select>
        </p>
        <button type="submit">Submit</button>
        <button type="reset">Cancel</button>
    </form>
    <p id="confirmation" aria-live="polite"></p>
    <p class="back-link"><a href="/">Back to Homework 9b</a></p>
</body>
</html>
